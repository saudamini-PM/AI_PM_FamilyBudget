const fmt = {
  currency: v => {
    const abs = Math.abs(v);
    const s = new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(abs);
    return v < 0 ? `-${s}` : s;
  },
  currencyAbs: v => new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Math.abs(v)),
  date: d => new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),
  dateShort: d => new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}),
  monthYear: (y,m) => new Date(y,m-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'}),
  pct: v => Math.round(v)+'%',
};

function cat(id){ return CATEGORIES.find(c=>c.id===id)||{id:'other',name:'Other',icon:'📦',color:'#666'}; }
function catBadge(id){
  const c = cat(id);
  return `<span class="badge badge-${id}">${c.icon} ${c.name}</span>`;
}
function uid(){ return 't'+(Date.now()).toString(36)+Math.random().toString(36).slice(2,6); }

function txnsByMonth(txns, y, m){
  return txns.filter(t=>{
    const d=new Date(t.date+'T00:00:00');
    return d.getFullYear()===y && d.getMonth()===m-1;
  });
}
function sumExpenses(txns){ return txns.filter(t=>t.type==='expense').reduce((s,t)=>s+Math.abs(t.amount),0); }
function sumIncome(txns){   return txns.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0); }
function spendByCat(txns, catId){ return txns.filter(t=>t.type==='expense'&&t.category===catId).reduce((s,t)=>s+Math.abs(t.amount),0); }

  if(period==='current_month')      filtered = txnsByMonth(txns,CUR_Y,CUR_M);
  else if(period==='last_month')    filtered = txnsByMonth(txns,CUR_Y,CUR_M-1);
  else if(period==='last_3_months') filtered = txns.filter(t=>new Date(t.date+'T00:00:00')>=new Date(2024,2,1));
  else                              filtered = txns;

  const expenses = filtered.filter(t=>t.type==='expense');
  if(category_name){
    const c = CATEGORIES.find(c=>c.name.toLowerCase().includes(category_name.toLowerCase()));
    if(c){
      const amt = spendByCat(expenses, c.id);
      return {category:c.name, total:amt.toFixed(2), transactions_count:expenses.filter(t=>t.category===c.id).length};
    }
    return {error:'Category not found: '+category_name};
  }
  const bycat = {};
  CATEGORIES.filter(c=>c.bucket!=='income'&&c.bucket!=='transfer').forEach(c=>{
    const amt = spendByCat(expenses, c.id);
    if(amt>0) bycat[c.name] = amt.toFixed(2);
  });
  return {period, total_expenses:sumExpenses(expenses).toFixed(2), total_income:sumIncome(filtered).toFixed(2), by_category:bycat};
}

function toolGetBudgetStatus({period}){
  const txns = period==='last_month' ? txnsByMonth(S.transactions,CUR_Y,CUR_M-1) : txnsByMonth(S.transactions,CUR_Y,CUR_M);
  const result = [];
  const bud = S.budget;
  Object.keys(bud).forEach(catId=>{
    if(!bud[catId]) return;
    const spent = spendByCat(txns.filter(t=>t.type==='expense'), catId);
    const limit = bud[catId];
    const pct = limit>0 ? Math.round((spent/limit)*100) : 0;
    result.push({category:cat(catId).name, budget:limit, spent:spent.toFixed(2), percent_used:pct, status:pct>100?'OVER_BUDGET':pct>80?'APPROACHING':'ON_TRACK'});
  });
  return {period, days_elapsed:CUR_DAY, days_in_month:DAYS_IN_MONTH, categories:result};
}

function toolGetCashFlow({months}){
  const n = Math.min(months||6,6);
  const result = [];
  for(let i=n-1;i>=0;i--){
    let y=CUR_Y, m=CUR_M-i;
    if(m<=0){m+=12;y--;}
    const txns = txnsByMonth(S.transactions,y,m);
    const inc = sumIncome(txns), exp = sumExpenses(txns);
    result.push({month:new Date(y,m-1,1).toLocaleDateString('en-US',{month:'short',year:'numeric'}), income:inc.toFixed(2), expenses:exp.toFixed(2), net:(inc-exp).toFixed(2)});
  }
  return {months:result};
}

function toolGetGoalProgress({goal_name}){
  const goals = S.goals;
  if(goal_name){
    const g = goals.find(g=>g.name.toLowerCase().includes(goal_name.toLowerCase()));
    if(!g) return {error:'Goal not found'};
    const remaining = g.target-g.saved;
    const months_to_go = remaining>0 ? Math.ceil(remaining/g.monthlyContrib) : 0;
    return {...g, remaining:remaining.toFixed(2), months_to_complete:months_to_go, on_track:months_to_go<=6};
  }
  return {goals:goals.map(g=>({name:g.name,target:g.target,saved:g.saved,percent:Math.round((g.saved/g.target)*100),monthly_contribution:g.monthlyContrib}))};
}

function toolGetTransactions({start_date,end_date,category_name,limit}){
  let txns = S.transactions.filter(t=>t.type==='expense');
  if(start_date) txns=txns.filter(t=>t.date>=start_date);
  if(end_date)   txns=txns.filter(t=>t.date<=end_date);
  if(category_name){
    const c=CATEGORIES.find(c=>c.name.toLowerCase().includes(category_name.toLowerCase()));
    if(c) txns=txns.filter(t=>t.category===c.id);
  }
  txns.sort((a,b)=>b.date.localeCompare(a.date));
  const top = txns.slice(0,Math.min(limit||10,20));
  return {count:top.length, transactions:top.map(t=>({date:t.date,payee:t.payee,amount:(-Math.abs(t.amount)).toFixed(2),category:cat(t.category).name}))};
}

const AI_TOOLS = [{
  functionDeclarations:[
    {name:'get_spending_summary',description:'Returns total spending by category for a time period',
     parameters:{type:'OBJECT',properties:{
       period:{type:'STRING',enum:['current_month','last_month','last_3_months','all_time'],description:'Time period to query'},
       category_name:{type:'STRING',description:'Optional: specific category name to filter by'}
     },required:['period']}},
    {name:'get_budget_status',description:'Returns budget limit vs actual spending for all categories',
     parameters:{type:'OBJECT',properties:{
       period:{type:'STRING',enum:['current_month','last_month'],description:'Budget period'}
     },required:['period']}},
    {name:'get_cash_flow',description:'Returns monthly income vs expenses trend over N months',
     parameters:{type:'OBJECT',properties:{
       months:{type:'NUMBER',description:'Number of months to look back (max 6)'}
     },required:[]}},
    {name:'get_goal_progress',description:'Returns savings goal progress',
     parameters:{type:'OBJECT',properties:{
       goal_name:{type:'STRING',description:'Optional: name of specific goal'}
     },required:[]}},
    {name:'get_transactions',description:'Returns filtered list of recent transactions',
     parameters:{type:'OBJECT',properties:{
       start_date:{type:'STRING',description:'Start date YYYY-MM-DD'},
       end_date:{type:'STRING',description:'End date YYYY-MM-DD'},
       category_name:{type:'STRING',description:'Filter by category name'},
       limit:{type:'NUMBER',description:'Max results (default 10)'}
     },required:[]}}
  ]
}];

function executeTool(name, args){
  const map = {
    get_spending_summary: toolGetSpendingSummary,
    get_budget_status:    toolGetBudgetStatus,
    get_cash_flow:        toolGetCashFlow,
    get_goal_progress:    toolGetGoalProgress,
    get_transactions:     toolGetTransactions,
  };
  const fn = map[name];
  if(!fn) return {error:'Unknown tool: '+name};
  try{ return fn(args||{}); }
  catch(e){ return {error:e.message}; }
}

const SYSTEM_PROMPT = () => `You are a friendly budget assistant for the ${S.household?.name||'household'} family.
Today is June 18, 2024. The current budget period is June 2024 (18 days elapsed of 30).
Members: ${(S.household?.members||[]).join(', ')}.
Always use a tool to answer financial questions — never invent numbers.
Keep answers concise (2–4 sentences) and in plain English, like explaining to a friend.
Be warm, friendly, and encouraging. Use the family's actual data.
This is not financial advice — you are summarising their own data.`;

async function callGemini(contents){
  const key = getGeminiKey();
  if(!key) throw new Error('NO_KEY');
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`;
  const res = await fetch(url,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      contents,
      tools: AI_TOOLS,
      systemInstruction:{parts:[{text:SYSTEM_PROMPT()}]},
      generationConfig:{temperature:.7,maxOutputTokens:600}
    })
  });
  if(!res.ok){
    const err = await res.json().catch(()=>({}));
    throw new Error(err?.error?.message||`API error ${res.status}`);
  }
  return res.json();
}

async function chat(userMessage){
  const history = S.chatHistory.slice(-8).map(m=>({
    role: m.role==='user'?'user':'model',
    parts:[{text:m.text}]
  }));
  const newMsg = {role:'user',parts:[{text:userMessage}]};
  let contents = [...history, newMsg];
  let data = await callGemini(contents);
  let candidate = data?.candidates?.[0];
  if(!candidate) throw new Error('No response from Gemini');
  let part = candidate.content?.parts?.[0];

  // Handle function calling (up to 3 rounds)
  for(let i=0;i<3;i++){
    if(!part?.functionCall) break;
    const fnName = part.functionCall.name;
    const fnArgs = part.functionCall.args||{};
    const fnResult = executeTool(fnName, fnArgs);
    contents = [...contents,
      {role:'model',parts:[{functionCall:{name:fnName,args:fnArgs}}]},
      {role:'user', parts:[{functionResponse:{name:fnName,response:fnResult}}]}
    ];
    data = await callGemini(contents);
    candidate = data?.candidates?.[0];
    part = candidate?.content?.parts?.[0];
  }
  return part?.text || 'I couldn\'t generate a response. Please try again.';
}

// App render: assign directly — all user-sourced values are escapeHtml()'d at their
// origin before being interpolated into these developer-controlled template strings.
// DOMPurify must NOT be used here: it strips onclick/event-handler attributes by design,
// which would silently break all navigation and interactive elements.
// DOMPurify is applied only to untrusted external content (AI responses) in formatAiMessage().
function safeSetHTML(el, html){
  el.innerHTML = html;
}

function render(){
  const root = document.getElementById('root');
  if(!S.user){ safeSetHTML(root, renderAuth()); attachAuthEvents(); return; }
  if(!getGeminiKey()){ safeSetHTML(root, renderApiSetup()); attachApiSetupEvents(); return; }
  if(!S.onboardingDone){ safeSetHTML(root, renderOnboarding()); attachOnboardingEvents(); return; }

  const views = {dashboard:renderDashboard,transactions:renderTransactions,import:renderImport,budget:renderBudget,chat:renderChat};
  const viewFn = views[currentView]||renderDashboard;
  safeSetHTML(root, renderShell(viewFn()));
  attachNavEvents();

  if(currentView==='dashboard')     { initDashboardCharts(); attachDashboardEvents(); }
  if(currentView==='transactions')  { attachTransactionEvents(); }
  if(currentView==='import')        { attachImportEvents(); }
  if(currentView==='budget')        { attachBudgetEvents(); }
  if(currentView==='chat')          { attachChatEvents(); scrollChatToBottom(); }
}

function attachNavEvents(){
  const avatar = document.getElementById('user-avatar');
  const menu   = document.getElementById('user-menu');
  if(!avatar || !menu) return;

  avatar.addEventListener('click', e => {
    e.stopPropagation();
    menu.classList.toggle('hidden');
  });

  // Close when clicking anywhere outside the menu
  document.addEventListener('click', function closeMenu(e){
    if(!menu.contains(e.target) && e.target !== avatar){
      menu.classList.add('hidden');
    }
  }, { once: false, capture: false });
}

function logout(){
  // Clear session state; preserve nothing — next user starts fresh
  setState({
    user: null,
    household: null,
    accounts: [],
    transactions: [],
    budget: {},
    goals: [],
    chatHistory: [],
    onboardingDone: false,
  });
  currentView = 'dashboard';
  render();
}

function switchKey(){
  // Clears the stored key so the API setup screen is shown again after re-login
  localStorage.removeItem('fba_gemini_key');
  setState({
    user: null,
    household: null,
    accounts: [],
    transactions: [],
    budget: {},
    goals: [],
    chatHistory: [],
    onboardingDone: false,
  });
  currentView = 'dashboard';
  render();
}

function initDashboardCharts(){
  const canvas = document.getElementById('cashflow-chart');
  if(!canvas) return;
  const months=[], incomes=[], exps=[];
  for(let i=5;i>=0;i--){
    let y=CUR_Y,m=CUR_M-i; if(m<=0){m+=12;y--;}
    const txns=txnsByMonth(S.transactions,y,m);
    months.push(new Date(y,m-1,1).toLocaleDateString('en-US',{month:'short'}));
    incomes.push(parseFloat(sumIncome(txns).toFixed(2)));
    exps.push(parseFloat(sumExpenses(txns.filter(t=>t.type==='expense')).toFixed(2)));
  }
  const ctx=canvas.getContext('2d');
  chartInstances['cashflow'] = new Chart(ctx,{
    type:'bar',
    data:{labels:months,datasets:[
      {label:'Income', data:incomes, backgroundColor:'#4AAE7A', borderRadius:4},
      {label:'Expenses',data:exps, backgroundColor:'#C84830', borderRadius:4}
    ]},
    options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:{grid:{color:'#EBE3D0'},ticks:{callback:v=>'$'+v.toLocaleString()}}}}
  });
}

        ${txns.length===0?`<div class="py-12 text-center text-ink/40"><div class="text-4xl mb-2">🔍</div><div>No transactions found</div></div>`:
        txns.map(t=>{

            <div class="col-span-4 font-500 truncate">${escapeHtml(t.payee)}</div>
            <div class="col-span-2">
              <select class="cat-select text-xs border border-cream-dark/60 rounded-lg px-1.5 py-1 bg-cream" data-id="${t.id}">
                ${CATEGORIES.map(c=>`<option value="${c.id}" ${t.category===c.id?'selected':''}>${c.icon} ${c.name}</option>`).join('')}
              </select>
            </div>
            <div class="col-span-2 text-ink/50 text-xs truncate">${escapeHtml(acc.name)}</div>

        }).join('')}
      </div>

    <div class="text-xs text-ink/40 text-center">${txns.length} transactions</div>

function attachTransactionEvents(){
  document.getElementById('select-all')?.addEventListener('change',function(){
    const checks = document.querySelectorAll('.txn-check');
    checks.forEach(c=>{ if(this.checked) txnSelected.add(c.dataset.id); else txnSelected.delete(c.dataset.id); });
    render();
  });
  document.querySelectorAll('.txn-check').forEach(c=>{
    c.addEventListener('change',function(){
      if(this.checked) txnSelected.add(this.dataset.id); else txnSelected.delete(this.dataset.id);
      render();
    });
  });
  document.querySelectorAll('.cat-select').forEach(s=>{
    s.addEventListener('change',function(){
      const idx = S.transactions.findIndex(t=>t.id===this.dataset.id);
      if(idx>=0){ S.transactions[idx].category=this.value; S.transactions[idx].status='confirmed'; saveState(); }
    });
  });
  document.getElementById('bulk-apply')?.addEventListener('click',function(){
    const newCat = document.getElementById('bulk-cat').value;
    if(!newCat) return;
    txnSelected.forEach(id=>{
      const idx=S.transactions.findIndex(t=>t.id===id);
      if(idx>=0){ S.transactions[idx].category=newCat; S.transactions[idx].status='confirmed'; }
    });
    saveState(); txnSelected.clear(); render();
  });
}

            </tr>`).join('')}

        </table>

      <div class="flex gap-3">
        <button id="import-confirm" class="btn-primary flex-1">✅ Import ${importState.preview.length} transactions</button>
        <button onclick="importState.stage='upload';render()" class="btn-ghost px-5">← Back</button>
      </div>
    </div>
    `:stage==='done'?`
    <div class="card p-10 text-center">
      <div class="text-6xl mb-4">🎉</div>
      <div class="fredoka text-2xl font-bold mb-2">Import complete!</div>
      <div class="text-ink/60 mb-6">Added <strong>${importState.preview.length}</strong> new transactions. Head to the ledger to review and categorise them.</div>
      <div class="flex gap-3 justify-center">
        <button onclick="navigate('transactions')" class="btn-primary">View Transactions →</button>
        <button onclick="importState={stage:'upload',file:null,parsed:[],mapping:{date:0,description:1,amount:2},accountId:'',errors:[],preview:[]};render()" class="btn-ghost">Import another file</button>
      </div>
    </div>
    `:''}
  </div>`;
}
function handleCsvFile(file, accountId, onDone){
  Papa.parse(file,{
    header:false, skipEmptyLines:true,
    complete: res=>{
      const rows = res.data;
      if(rows.length<2){ alert('File appears empty or unreadable.'); return; }
      const header = rows[0].map(h=>h.toLowerCase().trim());
      // Auto-detect columns
      let di=header.findIndex(h=>h.includes('date'));
      let pi=header.findIndex(h=>h.includes('desc')||h.includes('name')||h.includes('payee')||h.includes('memo'));
      let ai=header.findIndex(h=>h.includes('amount')||h.includes('debit')||h.includes('credit'));
      if(di<0)di=0; if(pi<0)pi=1; if(ai<0)ai=2;
      const preview=[], errors=[];
      rows.slice(1).forEach((row,idx)=>{
        try{
          const rawDate = row[di]?.trim();
          const rawDesc = row[pi]?.trim();
          const rawAmt  = row[ai]?.replace(/[$,\s]/g,'').trim();
          if(!rawDate||!rawDesc||!rawAmt) return;
          const dt = new Date(rawDate);
          if(isNaN(dt)) return;
          const dateStr = dt.toISOString().split('T')[0];
          const amt = parseFloat(rawAmt);
          if(isNaN(amt)) return;
          // Auto-categorise
          const catId = autoCat(rawDesc);
          const type  = amt>0?'income':catId==='transfer'?'transfer':'expense';
          preview.push({id:uid(),date:dateStr,payee:rawDesc,amount:amt,category:catId,account:accountId||S.accounts[0]?.id||'acc-1',type,status:'pending_review',notes:''});
        } catch(e){ errors.push(idx); }
      });
      if(onDone){
        S.transactions.push(...preview);
        saveState();
        onDone(preview.length);
      } else {
        importState.preview = preview;
        importState.errors  = errors.map(String);
        importState.stage   = 'preview';
        render();
      }
    },
    error: ()=>alert('Could not parse file. Please check it is a valid CSV.')
  });
}
function autoCat(desc){
  const d = desc.toLowerCase();
  if(/rent|mortgage|hoa|oakwood|property/.test(d))         return 'housing';
  if(/whole foods|trader joe|costco|aldi|kroger|safeway|grocery|market|food/.test(d)) return 'groceries';
  if(/electric|comcast|at&t|verizon|internet|utility|water|gas bill|pg&e/.test(d))   return 'utilities';
  if(/shell|bp|exxon|chevron|mobil|gas station|uber|lyft|transit|parking/.test(d))   return 'transport';
  if(/restaurant|cafe|mcdonald|chipotle|starbucks|dining|bistro|olive garden|pizza|sushi/.test(d)) return 'dining';
  if(/soccer|piano|school|tutor|daycare|kid|child|ymca|sport/.test(d))               return 'kids';
  if(/amazon|target|walmart|macy|zara|h&m|shop|store|mall/.test(d))                  return 'shopping';
  if(/netflix|spotify|hulu|disney|apple|google play|steam/.test(d))                  return 'entertainment';
  if(/doctor|pharmacy|cvs|walgreen|hospital|dental|medical|health/.test(d))          return 'healthcare';
  if(/salary|payroll|direct deposit|employer/.test(d))                               return 'income';
  if(/payment|transfer|zelle|venmo|paypal/.test(d))                                  return 'transfer';
  return 'other';
}
function attachImportEvents(){
  const fileIn = document.getElementById('import-file');
  if(fileIn){
    fileIn.onchange = e=>{
      const file = e.target.files[0]; if(!file) return;
      const accId = document.getElementById('import-account')?.value||S.accounts[0]?.id||'';
      importState.accountId = accId;
      handleCsvFile(file, accId, null);
    };
  }
  const dz = document.getElementById('import-dropzone');
  if(dz){
    dz.ondragover=e=>{e.preventDefault();dz.classList.add('drag-over')};
    dz.ondragleave=()=>dz.classList.remove('drag-over');
    dz.ondrop=e=>{
      e.preventDefault(); dz.classList.remove('drag-over');
      const file=e.dataTransfer.files[0]; if(!file) return;
      const accId=document.getElementById('import-account')?.value||S.accounts[0]?.id||'';
      importState.accountId=accId;
      handleCsvFile(file,accId,null);
    };
  }
  document.getElementById('import-confirm')?.addEventListener('click',()=>{
    const existing = new Set(S.transactions.map(t=>`${t.date}|${t.payee}|${t.amount}`));
    const deduped = importState.preview.filter(t=>!existing.has(`${t.date}|${t.payee}|${t.amount}`));
    S.transactions.push(...deduped);
    saveState();
    importState.stage='done';
    render();
  });
}

    <div class="flex items-center justify-between">
      <div class="fredoka text-2xl font-bold">Budget Setup</div>
      <div class="text-sm text-ink/60">June 2024</div>

        const pct=income>0?Math.round((total/income)*100):0;

        return `<div class="card">

function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Renders AI markdown to safe HTML.
// Step 1: escapeHtml neutralises any raw tags from the API response.
// Step 2: regex injects ONLY the allowed inline tags (<strong>, <em>, <br>).
// Step 3: DOMPurify strips anything else that somehow slipped through
//         (e.g. prompt-injection attempts in AI output).
function formatAiMessage(text){
  const escaped = escapeHtml(text)
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.*?)\*/g,'<em>$1</em>')
    .replace(/\n/g,'<br>');

  if(typeof DOMPurify !== 'undefined'){
    return DOMPurify.sanitize(escaped, {
      ALLOWED_TAGS: ['strong','em','br'],
      ALLOWED_ATTR: []   // no attributes — blocks href/src injection
    });
  }
  // DOMPurify not yet loaded (e.g. offline) — fall back to plain text only
  return escapeHtml(text).replace(/\n/g,'<br>');
}
function scrollChatToBottom(){
  const el=document.getElementById('chat-messages');
  if(el) el.scrollTop=el.scrollHeight;
}
async function sendChat(msg){
  msg = msg || document.getElementById('chat-input')?.value?.trim();
  if(!msg) return;
  const input = document.getElementById('chat-input');
  if(input) input.value='';
  S.chatHistory.push({role:'user',text:msg}); saveState();
  render(); scrollChatToBottom();

  // Add typing indicator
  const msgArea = document.getElementById('chat-messages');
  if(msgArea){
    const typing=document.createElement('div');
    typing.id='typing-ind';
    typing.className='flex justify-start';
    typing.innerHTML=`<div class="w-8 h-8 rounded-full bg-coral text-white flex items-center justify-center text-sm flex-shrink-0 mr-2 fredoka font-bold">✦</div><div class="chat-typing"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
    msgArea.appendChild(typing);
    msgArea.scrollTop=msgArea.scrollHeight;
  }

  try{
    let reply;
    if(getGeminiKey()==='DEMO_MODE'){
      await new Promise(r=>setTimeout(r,1200));
      reply = demoAiReply(msg);
    } else {
      reply = await chat(msg);
    }
    S.chatHistory.push({role:'assistant',text:reply}); saveState();
  } catch(e){
    S.chatHistory.push({role:'assistant',text:`Sorry, I ran into an error: ${e.message}. Please check your API key in settings.`}); saveState();
  }
  render(); scrollChatToBottom();
}
function demoAiReply(msg){
  const m=msg.toLowerCase();
  if(/dining|restaurant|food out/.test(m)) return "This month (Jun 1–18) you've spent **$272.70** on dining — that's 45% of your $600 budget with 40% of the month left. You're on track! Last month you spent $239.00 on dining.";
  if(/vacation|goal|saving/.test(m)) return "Great news! 🎉 You've saved **$3,240** toward your vacation goal of $5,000 — that's 65% done. At your current $420/month pace, you'll reach your goal **4 months early**. You're well ahead of schedule!";
  if(/grocery|groceries/.test(m)) return "June grocery spending so far: **$544.89** across 4 transactions (Whole Foods, Trader Joe's, Costco). Your monthly budget is $600, so you've used 91% with 12 days remaining. Watch the spending this last stretch!";
  if(/budget|over|track/.test(m)) return "Here's your June budget status:\n✅ **Housing**: $2,200 / $2,200 (100% — paid!)\n✅ **Transport**: $111 / $400 (28%)\n⚠️ **Groceries**: $545 / $600 (91%)\n✅ **Dining**: $273 / $600 (45%)\n✅ **Kids**: $125 / $500 (25%)\nOverall you're doing well — no categories are over budget yet.";
  if(/income|earn|salary/.test(m)) return "This month you've received **$8,400** in income — two direct deposits of $4,200 each (June 1 and June 15). Last month was also $8,400. Consistent income is great for budgeting!";
  if(/overspend|biggest|most/.test(m)) return "Last month (May) your **top 3 expenses** were:\n1. 🏠 Rent: $2,200\n2. 🛒 Groceries: $554.74 (Costco $245, Whole Foods $134, Trader Joe's $175)\n3. 🍽️ Dining: $239 — mainly the Capital Grille anniversary dinner ($138).";
  return `I can answer questions about your spending, budget tracking, and savings goals! Try asking:\n• "How much did we spend on groceries last month?"\n• "Are we on track for vacation savings?"\n• "What's our net cash flow?"`;
}
